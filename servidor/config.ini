# Sistema de correo -- Practica IFOR (Escenario 1)
# Los valores por defecto viven en config.py; aqui solo se pisa lo que se
# quiera cambiar.  Rutas relativas a este directorio (servidor/).

[smtp]
host = 0.0.0.0
puerto = 25

[webmail]
host = 0.0.0.0
puerto = 8080

[correo]
# Dominio local: solo se entregara correo destinado a este dominio.
dominio = empresa.local

[rutas]
base = buzones
usuarios = usuarios.json

[limites]
max_conexiones = 20
max_tamano_mb = 25
timeout_seg = 120
